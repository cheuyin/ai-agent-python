[project]
name = "ai-agent-python"
version = "0.1.0"
description = "A local AI coding agent powered by Google Gemini"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.3.0",
    "python-dotenv==1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
ai-agent = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
